[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "faceproof"
version = "0.2.0"
description = "Consent-first face-to-web discovery with tamper-evident Ethereum verification"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "HH Goa Task 3 Team" }]
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "python-dotenv>=1.0,<2",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "web3>=7,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
faceproof = "faceproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faceproof"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
